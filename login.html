
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DashBoard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-chart-pie"></i> DashBoard</div>
    <h1>Welcome Back!</h1>
    <p class="login-subtitle">Please enter your details to sign in.</p>
    <form>
      <label class="field-label">Email Address</label>
      <input class="settings-input" type="email" placeholder="Enter your email" required>
      <label class="field-label">Password</label>
      <input class="settings-input" type="password" placeholder="Enter your password" required>
      <div class="login-options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="primary-button login-button" type="button">Sign In</button>
    </form>
    <p class="login-footer">Don't have an account? <a href="#">Contact Admin</a></p>
  </div>
</body>
</html>
